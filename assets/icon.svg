<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#DB2777" />
      <stop offset="48%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#500724" />
    </radialGradient>

    <!-- Top Ambient Sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.32" />
      <stop offset="32%" stop-color="#F472B6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Printer Body Gradients -->
    <linearGradient id="bodyUpper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="scannerLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="rimHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="outTray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="80%" stop-color="#131B28" />
      <stop offset="100%" stop-color="#0C111A" />
    </linearGradient>

    <linearGradient id="a4Paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <radialGradient id="ledGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="60%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#064E3B" />
    </radialGradient>
  </defs>

  <!-- 1. Squircle Base Card -->
  <rect x="24" y="24" width="464" height="464" rx="106" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="106" fill="url(#sheen)" />
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="#F472B6" stroke-opacity="0.32" stroke-width="2.5" />
  <rect x="42" y="42" width="428" height="428" rx="92" fill="none" stroke="#F472B6" stroke-opacity="0.18" stroke-width="2.5" />

  <!-- 2. REAR TOP INPUT TRAY (上部后置进纸架与整叠 A4 白纸) -->
  <g>
    <path d="M 174 80 L 338 80 A 8 8 0 0 1 346 88 L 348 162 L 164 162 L 166 88 A 8 8 0 0 1 174 80 Z" fill="#1A2232" />
    <rect x="180" y="82" width="152" height="4" rx="2" fill="#334155" opacity="0.6" />
    <rect x="186" y="92" width="140" height="70" rx="4" fill="#CBD5E1" />
    <rect x="188" y="88" width="136" height="72" rx="4" fill="#FFFFFF" />
    <rect x="178" y="118" width="8" height="24" rx="2" fill="#0EA5E9" opacity="0.8" />
    <rect x="326" y="118" width="8" height="24" rx="2" fill="#0EA5E9" opacity="0.8" />
  </g>

  <!-- 3. MAIN A4 PRINTER BODY (扁平纤薄现代办公打印机主机 - 优化降低机身高度) -->
  <g>
    <rect x="94" y="158" width="324" height="112" rx="22" fill="#000000" opacity="0.35" />
    <rect x="94" y="154" width="324" height="112" rx="22" fill="url(#bodyUpper)" />
    <rect x="106" y="160" width="300" height="38" rx="12" fill="url(#scannerLid)" />
    <rect x="232" y="190" width="48" height="4" rx="2" fill="#0F172A" opacity="0.8" />

    <path d="M 118 154 L 394 154 A 22 22 0 0 1 418 176 L 418 180 A 22 22 0 0 0 394 158 L 118 158 A 22 22 0 0 0 94 180 L 94 176 A 22 22 0 0 1 118 154 Z" fill="url(#rimHi)" />
    <rect x="94" y="154" width="324" height="112" rx="22" fill="none" stroke="#475569" stroke-opacity="0.35" stroke-width="1.5" />

    <line x1="96" y1="202" x2="416" y2="202" stroke="#0F172A" stroke-width="2.5" />
    <line x1="96" y1="203.5" x2="416" y2="203.5" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

    <!-- Control Panel -->
    <rect x="114" y="210" width="68" height="20" rx="4" fill="#064E3B" />
    <rect x="114" y="210" width="68" height="20" rx="4" fill="none" stroke="#047857" stroke-width="1" />
    <rect x="119" y="215" width="28" height="2.5" rx="1.2" fill="#34D399" opacity="0.95" />
    <rect x="119" y="220" width="18" height="2.5" rx="1.2" fill="#34D399" opacity="0.65" />
    <circle cx="172" cy="220" r="2.2" fill="#34D399" />

    <!-- CMYK 4-Color Cartridge Level Indicators -->
    <g transform="translate(187, 212)">
      <rect x="0" y="0" width="3" height="16" rx="1.5" fill="#164E63" />
      <rect x="0" y="4" width="3" height="12" rx="1.5" fill="#06B6D4" />
      <rect x="5" y="0" width="3" height="16" rx="1.5" fill="#831843" />
      <rect x="5" y="3" width="3" height="13" rx="1.5" fill="#EC4899" />
      <rect x="10" y="0" width="3" height="16" rx="1.5" fill="#713F12" />
      <rect x="10" y="2" width="3" height="14" rx="1.5" fill="#FACC15" />
      <rect x="15" y="0" width="3" height="16" rx="1.5" fill="#020617" />
      <rect x="15" y="6" width="3" height="10" rx="1.5" fill="#94A3B8" />
    </g>

    <!-- Status LED -->
    <circle cx="218" cy="220" r="7" fill="#EC4899" opacity="0.25" />
    <circle cx="218" cy="220" r="4.5" fill="#090D16" />
    <circle cx="218" cy="220" r="3.2" fill="url(#ledGrad)" />
    <circle cx="217" cy="219" r="1" fill="#FFFFFF" />

    <!-- Buttons -->
    <rect x="296" y="210" width="28" height="20" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <path d="M 306 216 L 314 224 M 314 216 L 306 224" stroke="#EF4444" stroke-width="1.6" stroke-linecap="round" />
    <rect x="330" y="210" width="30" height="20" rx="5" fill="#10B981" />
    <polygon points="341,216 350,220 341,224" fill="#FFFFFF" />
    <rect x="366" y="210" width="30" height="20" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="381" cy="220" r="4.5" fill="none" stroke="#0EA5E9" stroke-width="1.6" />
    <line x1="381" y1="216" x2="381" y2="220" stroke="#0EA5E9" stroke-width="1.6" stroke-linecap="round" />

    <!-- Bottom Eject Slot (紧凑低矮出纸口) -->
    <path d="M 122 236 L 390 236 A 6 6 0 0 1 396 242 L 396 258 A 8 8 0 0 1 388 266 L 124 266 A 8 8 0 0 1 116 258 L 116 242 A 6 6 0 0 1 122 236 Z" fill="#0B0F19" />
    <path d="M 122 236 L 390 236 A 6 6 0 0 1 396 242 L 396 258 A 8 8 0 0 1 388 266 L 124 266 A 8 8 0 0 1 116 258 L 116 242 A 6 6 0 0 1 122 236 Z" fill="none" stroke="#060A10" stroke-width="1.5" />
    <rect x="142" y="238" width="228" height="2.5" rx="1.2" fill="#FBCFE8" opacity="0.8" />
  </g>

  <!-- 4. EXTENDED OUTPUT TRAY & PRINTED A4 INVOICE (黄金比例紧凑发票) -->
  <path d="M 134 254 L 378 254 L 384 374 A 12 12 0 0 1 372 386 L 140 386 A 12 12 0 0 1 128 374 Z" fill="url(#outTray)" />
  <path d="M 134 254 L 378 254 L 384 374 A 12 12 0 0 1 372 386 L 140 386 A 12 12 0 0 1 128 374 Z" fill="none" stroke="#334155" stroke-opacity="0.35" stroke-width="1.5" />
  <rect x="220" y="377" width="72" height="4.5" rx="2.2" fill="#38BDF8" opacity="0.8" />

  <!-- A4 Invoice Sheet Body (缩短至 y=373) -->
  <g>
    <path d="M 148 250 L 364 250 L 372 372 L 140 372 Z" fill="#000000" opacity="0.3" />
    <path d="M 148 246 L 364 246 A 6 6 0 0 1 370 252 L 374 366 A 7 7 0 0 1 367 373 L 145 373 A 7 7 0 0 1 138 366 L 142 252 A 6 6 0 0 1 148 246 Z" fill="url(#a4Paper)" />

    <!-- A4 Invoice Header -->
    <rect x="156" y="256" width="200" height="3" rx="1.5" fill="#E11D48" />
    <rect x="156" y="261" width="200" height="1.2" rx="0.6" fill="#E11D48" opacity="0.8" />
    <rect x="222" y="265" width="68" height="5.5" rx="2.7" fill="#E11D48" />

    <rect x="156" y="274" width="60" height="2.8" rx="1.4" fill="#64748B" />
    <rect x="156" y="279" width="76" height="2.8" rx="1.4" fill="#94A3B8" />

    <!-- QR Code Matrix -->
    <g transform="translate(326, 267)">
      <rect x="0" y="0" width="24" height="24" rx="2.5" fill="#0F172A" />
      <rect x="1.5" y="1.5" width="21" height="21" rx="1.5" fill="#FFFFFF" />
      <rect x="3.5" y="3.5" width="5.5" height="5.5" fill="#0F172A" />
      <rect x="15" y="3.5" width="5.5" height="5.5" fill="#0F172A" />
      <rect x="3.5" y="15" width="5.5" height="5.5" fill="#0F172A" />
      <rect x="11" y="6" width="2" height="4" fill="#0F172A" />
      <rect x="7" y="11" width="4" height="2" fill="#0F172A" />
      <rect x="12" y="12" width="5" height="5" fill="#0EA5E9" />
    </g>

    <!-- Table Grid -->
    <rect x="156" y="293" width="200" height="56" rx="2" fill="none" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="156" y="293" width="200" height="11" fill="#F8FAFC" />
    <line x1="156" y1="304" x2="356" y2="304" stroke="#CBD5E1" stroke-width="1" />

    <rect x="160" y="297" width="34" height="3.5" rx="1.7" fill="#475569" />
    <rect x="206" y="297" width="22" height="3.5" rx="1.7" fill="#64748B" />
    <rect x="248" y="297" width="26" height="3.5" rx="1.7" fill="#64748B" />
    <rect x="298" y="297" width="38" height="3.5" rx="1.7" fill="#475569" />

    <rect x="160" y="309" width="38" height="2.8" rx="1.4" fill="#64748B" />
    <rect x="250" y="309" width="20" height="2.8" rx="1.4" fill="#94A3B8" />
    <rect x="302" y="309" width="34" height="2.8" rx="1.4" fill="#10B981" />

    <line x1="156" y1="316" x2="356" y2="316" stroke="#F1F5F9" stroke-width="1" />
    <rect x="160" y="320.5" width="48" height="2.8" rx="1.4" fill="#94A3B8" />
    <rect x="306" y="320.5" width="26" height="2.8" rx="1.4" fill="#94A3B8" />

    <line x1="156" y1="329" x2="356" y2="329" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="156" y="329" width="200" height="20" fill="#FFF1F2" fill-opacity="0.75" />
    <rect x="160" y="337" width="46" height="4" rx="2" fill="#E11D48" />

    <g transform="translate(290, 333)">
      <rect x="0" y="0" width="60" height="13" rx="3.5" fill="#E11D48" />
      <text x="30" y="9.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">¥ 1,280.00</text>
    </g>

    <!-- Fiscal Stamp -->
    <g transform="translate(294, 304) rotate(-7)">
      <ellipse cx="22" cy="18" rx="26" ry="17" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="4 1.5" opacity="0.92" />
      <ellipse cx="22" cy="18" rx="22" ry="13" fill="none" stroke="#E11D48" stroke-width="0.8" opacity="0.8" />
      <polygon points="22,11 24,15 28,15 25,18 26,22 22,19 18,22 19,18 16,15 20,15" fill="#E11D48" />
      <text x="22" y="28" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="6" font-weight="bold" fill="#E11D48" text-anchor="middle" letter-spacing="0.5">发票专用</text>
    </g>

    <g stroke="#94A3B8" stroke-width="1.2" fill="none" opacity="0.6">
      <path d="M 148 254 L 148 250 L 152 250" />
      <path d="M 364 254 L 364 250 L 360 250" />
      <path d="M 148 364 L 148 368 L 152 368" />
      <path d="M 364 364 L 364 368 L 360 368" />
    </g>
  </g>
</svg>
