name: Build & Release Desktop App (Windows, Mac & Linux/UOS)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag 版本号 (只支持英文/数字/点/破折号，如: v1.2.0)'
        required: true
        default: 'v1.2.0'
      release_title:
        description: 'Release 发布标题 (可含中文，如: 智能发票管理助手 v1.2.0 正式版)'
        required: false
        default: '智能发票管理助手 v1.2.0 正式版'
      is_draft:
        description: '是否发布为草稿 (Draft)?'
        type: boolean
        default: false
      is_prerelease:
        description: '是否标记为预发布 (Pre-release)?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Distribution
        run: npm run build

      - name: Build Electron Package
        run: npx electron-builder --config electron-builder.json --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ matrix.os }}
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.deb
            dist_electron/*.AppImage
          if-no-files-found: ignore

      - name: Normalize Tag Name
        id: tag_step
        shell: bash
        run: |
          RAW_TAG="${{ inputs.release_tag }}"
          # 提取并清理标签名：只保留英文字母、数字、点、横杠、下划线 (去除中文字符与空格)
          CLEAN_TAG=$(echo "$RAW_TAG" | sed 's/[^a-zA-Z0-9._-]//g')
          if [ -z "$CLEAN_TAG" ]; then
            CLEAN_TAG="v1.2.0"
          fi
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT

      # 仅在手动触发 workflow_dispatch 时发布到 GitHub Releases
      - name: Create / Update GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.tag }}
          name: ${{ inputs.release_title || inputs.release_tag || '智能发票管理助手 v1.2.0 正式版' }}
          files: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.deb
            dist_electron/*.AppImage
            scripts/uos-install-bypass.sh
          draft: ${{ inputs.is_draft || false }}
          prerelease: ${{ inputs.is_prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
