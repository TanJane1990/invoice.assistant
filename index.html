<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能发票管理助手</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #0A0F1D;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .splash-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #172554 0%, #0E172B 45%, #0A0F1D 100%);
        z-index: 9999;
      }
      .splash-logo-box {
        position: relative;
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
      }
      .splash-pulse-ring {
        position: absolute;
        inset: -10px;
        border-radius: 26px;
        background: linear-gradient(135deg, rgba(232, 0, 10, 0.45), rgba(59, 130, 246, 0.4));
        filter: blur(14px);
        animation: splashGlow 2.4s ease-in-out infinite alternate;
      }
      .splash-logo-card {
        position: relative;
        width: 84px;
        height: 84px;
        background: linear-gradient(145deg, #E8000A, #B91C1C);
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 32px rgba(232, 0, 10, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        animation: splashFloat 3s ease-in-out infinite alternate;
      }
      .splash-logo-card svg {
        width: 44px;
        height: 44px;
        color: #ffffff;
      }
      .splash-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #ffffff;
        margin-bottom: 8px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      .splash-subtitle {
        font-size: 13px;
        font-weight: 500;
        color: #94A3B8;
        letter-spacing: 0.5px;
        margin-bottom: 30px;
      }
      .splash-progress-box {
        width: 240px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 14px;
      }
      .splash-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #E8000A, #38BDF8);
        border-radius: 999px;
        animation: splashProgress 1.6s ease-in-out infinite;
      }
      .splash-status-text {
        font-size: 11px;
        font-weight: 600;
        color: #64748B;
        letter-spacing: 0.5px;
      }
      @keyframes splashGlow {
        0% { opacity: 0.4; transform: scale(0.95); }
        100% { opacity: 0.85; transform: scale(1.1); }
      }
      @keyframes splashFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-5px); }
      }
      @keyframes splashProgress {
        0% { left: -45%; }
        50% { left: 35%; width: 55%; }
        100% { left: 100%; width: 35%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-container">
        <div class="splash-logo-box">
          <div class="splash-pulse-ring"></div>
          <div class="splash-logo-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
          </div>
        </div>
        <h1 class="splash-title">智能发票管理助手</h1>
        <p class="splash-subtitle">专为财务与报销打造的智能打印排版系统</p>
        <div class="splash-progress-box">
          <div class="splash-progress-bar"></div>
        </div>
        <div class="splash-status-text">⚡ 正在极速加载本地发票数据库与 OCR 识别引擎...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
